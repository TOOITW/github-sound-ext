<!doctype html>
<html>
  <head><meta charset="utf-8"></head>
  <body>
    <script>
      let audio;
      chrome.runtime.onMessage.addListener(async (msg) => {
        if (msg?.type === 'OFFSCREEN_PLAY') {
          try {
            if (!audio) {
              audio = new Audio(chrome.runtime.getURL('sounds/success.mp3'));
            }
            await audio.play();
          } catch (e) {
            console.error('[offscreen] play failed:', e);
          }
        }
      });
    </script>
  </body>
</html>
